name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build & tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Tests (H2 + Testcontainers/PostgreSQL)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate docs/api/openapi.yaml
        run: npx --yes @apidevtools/swagger-cli@4.0.4 validate docs/api/openapi.yaml
