plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.hilt)
}

android {
    namespace 'app.cuentasclaras'
    compileSdk 34

    defaultConfig {
        applicationId 'app.cuentasclaras'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'app.cuentasclaras.HiltTestRunner'
    }

    buildTypes {
        debug {
            // Emulador Android -> host local (backend Spring Boot en el puerto 8080).
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8080/api/v1/"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'API_BASE_URL', '"https://api.cuentas-claras.app/api/v1/"'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion libs.versions.composeCompiler.get()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':feature:auth')
    implementation project(':feature:groups')
    implementation project(':data')
    implementation project(':domain')
    implementation project(':core:common')
    implementation project(':core:network')
    implementation project(':core:designsystem')

    implementation platform(libs.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.kotlinx.coroutines.android
    implementation libs.hilt.android
    kapt libs.hilt.compiler

    debugImplementation libs.androidx.ui.tooling

    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.hilt.android.testing
    androidTestImplementation libs.androidx.paging.common
    androidTestImplementation libs.androidx.paging.testing
    androidTestImplementation project(':core:database')
    kaptAndroidTest libs.hilt.compiler
}
